name: metric

services:
  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      APP_ENV: production
      AUTH_MODE: proxy
      ADDR: ":8080"
      DATABASE_PATH: /data/traffic.db
      AUTH_EMAIL_HEADER: X-Auth-Request-Email
      AUTH_USER_HEADER: X-Auth-Request-User
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      TRUST_PROXY: "true"
      METRICS_WINDOW: ${METRICS_WINDOW:-60s}
      WORKER_INTERVAL: ${WORKER_INTERVAL:-5s}
      SNAPSHOT_RETENTION: ${SNAPSHOT_RETENTION:-168h}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
    volumes:
      - metric-data:/data
    healthcheck:
      test: ["CMD", "/metric-api", "--healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - internal

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    restart: unless-stopped
    command: ["--config=/etc/oauth2-proxy/oauth2-proxy.cfg"]
    volumes:
      - ./deploy/oauth2-proxy.cfg:/etc/oauth2-proxy/oauth2-proxy.cfg:ro
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID:?set OAUTH2_PROXY_CLIENT_ID in .env}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:?set OAUTH2_PROXY_CLIENT_SECRET in .env}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?set OAUTH2_PROXY_COOKIE_SECRET in .env}
      OAUTH2_PROXY_EMAIL_DOMAINS: ${OAUTH2_PROXY_EMAIL_DOMAINS:-*}
      OAUTH2_PROXY_REDIRECT_URL: ${OAUTH2_PROXY_REDIRECT_URL:?set OAUTH2_PROXY_REDIRECT_URL in .env}
      OAUTH2_PROXY_WHITELIST_DOMAINS: ${OAUTH2_PROXY_WHITELIST_DOMAINS:-}
      OAUTH2_PROXY_COOKIE_SECURE: "true"
    networks:
      - internal

  edge:
    build:
      context: .
      dockerfile: deploy/Dockerfile.edge
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      oauth2-proxy:
        condition: service_started
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
      ACME_EMAIL: ${ACME_EMAIL:-}
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal

networks:
  internal:

volumes:
  metric-data:
  caddy-data:
  caddy-config:
