openapi: 3.0.3
info:
  title: Metric API
  version: 1.0.0
  description: |
    HTTP contract for Metric. Control-plane routes require the trusted identity
    established by the deployment's proxy (or development identity locally).
    Admin-only operations are identified below. Ingest uses a project API key.
    WebSocket message schemas are defined here for shared validation, but the
    WebSocket transport is not an HTTP JSON API.
servers:
  - url: /
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Process is running
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /ingest/{projectID}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    post:
      operationId: ingestLogs
      security:
        - ingestKey: []
      description: Accepts 1–1000 records; the JSON body is limited to 1 MiB.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngestRequest' }
      responses:
        '202':
          description: Accepted records
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestResponse' }
        default: { $ref: '#/components/responses/Error' }
  /api/auth/me:
    get:
      operationId: getMe
      responses:
        '200':
          description: Current trusted identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        default: { $ref: '#/components/responses/Error' }
  /api/users:
    get:
      operationId: listKnownUsers
      description: Admin only. Identities seen after trusted sign-in.
      responses:
        '200':
          description: Known user emails
          headers:
            Cache-Control:
              description: The directory must not be cached.
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema: { type: array, items: { type: string } }
        default: { $ref: '#/components/responses/Error' }
  /api/projects:
    get:
      operationId: listProjects
      responses:
        '200':
          description: Accessible projects
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createProject
      description: Admin only. The plaintext API key is returned only once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProjectRequest' }
      responses:
        '201':
          description: Created project and ingest key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedProject' }
        default: { $ref: '#/components/responses/Error' }
  /api/projects/{projectID}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      operationId: getProject
      responses:
        '200':
          description: Accessible project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: assignProjectOwner
      description: Admin only. An empty or omitted owner makes the project admin-only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignOwnerRequest' }
      responses:
        '200':
          description: Updated project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteProject
      description: Admin only.
      responses:
        '204': { description: Project deleted }
        default: { $ref: '#/components/responses/Error' }
  /api/projects/{projectID}/viewers:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      operationId: listProjectViewers
      description: Admin only. View-only project members.
      responses:
        '200':
          description: Viewer emails
          headers:
            Cache-Control:
              description: Project membership must not be cached.
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema: { type: array, items: { type: string } }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: addProjectViewer
      description: Admin only. The email must have previously signed in.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ViewerRequest' }
      responses:
        '204': { description: Viewer added }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: removeProjectViewer
      description: Admin only. Revokes project access and disconnects active streams.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ViewerRequest' }
      responses:
        '204': { description: Viewer removed }
        default: { $ref: '#/components/responses/Error' }
  /api/projects/{projectID}/api-key:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    post:
      operationId: rotateProjectKey
      description: Admin only. Returns the new plaintext key once.
      responses:
        '200':
          description: Project and new ingest key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedProject' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: revokeProjectKey
      description: Admin only.
      responses:
        '204': { description: Key revoked }
        default: { $ref: '#/components/responses/Error' }
  /api/projects/{projectID}/thresholds:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      operationId: getThresholds
      responses:
        '200':
          description: Project thresholds
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Threshold' }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: updateThresholds
      description: Admin only. Zero disables the corresponding rule.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ThresholdUpdateRequest' }
      responses:
        '200':
          description: Updated thresholds
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Threshold' }
        default: { $ref: '#/components/responses/Error' }
  /api/projects/{projectID}/metrics:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      operationId: getMetrics
      responses:
        '200':
          description: Current rolling snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Snapshot' }
        default: { $ref: '#/components/responses/Error' }
  /api/projects/{projectID}/metrics/history:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      operationId: getMetricHistory
      description: The newest 900 persisted snapshots for an accessible project, in chronological order.
      responses:
        '200':
          description: Recent persisted snapshots (empty if none exist)
          headers:
            Cache-Control:
              description: Project history must not be cached.
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                type: array
                maxItems: 900
                items: { $ref: '#/components/schemas/Snapshot' }
        default: { $ref: '#/components/responses/Error' }
  /api/projects/{projectID}/anomalies:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      operationId: listAnomalies
      parameters:
        - { name: limit, in: query, schema: { type: integer }, description: 'Defaults to 100; values outside 1–1000 are ignored.' }
      responses:
        '200':
          description: Recent incidents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Anomaly' }
        default: { $ref: '#/components/responses/Error' }
  /api/audit:
    get:
      operationId: listAudit
      description: Admin only. before and before_id together form an exclusive cursor.
      parameters:
        - { name: limit, in: query, schema: { type: integer } }
        - { name: action, in: query, schema: { type: string } }
        - { name: project_id, in: query, schema: { type: string } }
        - { name: before, in: query, schema: { type: string, format: date-time } }
        - { name: before_id, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: Audit events, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditEvent' }
        default: { $ref: '#/components/responses/Error' }
  /ws/{projectID}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      operationId: connectProjectWebSocket
      description: WebSocket upgrade using trusted identity. Messages are MetricSnapshotEvent or AnomalyAlertEvent.
      responses:
        '101': { description: WebSocket upgrade }
        default: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    ingestKey: { type: apiKey, in: header, name: X-API-Key }
  parameters:
    ProjectID:
      name: projectID
      in: path
      required: true
      schema: { type: string }
  responses:
    Error:
      description: Error response (status varies by failure)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    ViewerRequest:
      type: object
      required: [email]
      properties:
        email: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        request_id: { type: string }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Me:
      type: object
      required: [email, admin]
      properties:
        email: { type: string }
        user: { type: string }
        admin: { type: boolean }
    Project:
      type: object
      required: [project_id, name]
      properties:
        project_id: { type: string }
        name: { type: string }
        owner_email: { type: string }
    CreatedProject:
      type: object
      required: [project_id, name, api_key]
      properties:
        project_id: { type: string }
        name: { type: string }
        owner_email: { type: string }
        api_key: { type: string }
    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, description: 'Trimmed by the server; maximum 100 UTF-8 bytes.' }
    AssignOwnerRequest:
      type: object
      properties:
        owner_email: { type: string, description: 'An empty string removes ownership.' }
    Threshold:
      type: object
      required: [p95_ms, error_rate, rps_max, req_per_ip_max]
      properties:
        p95_ms: { type: number, minimum: 0 }
        error_rate: { type: number, minimum: 0, maximum: 100 }
        rps_max: { type: number, minimum: 0 }
        req_per_ip_max: { type: number, minimum: 0 }
    ThresholdUpdateRequest:
      type: object
      description: 'Omitted fields become zero, disabling their rules.'
      properties:
        p95_ms: { type: number, minimum: 0 }
        error_rate: { type: number, minimum: 0, maximum: 100 }
        rps_max: { type: number, minimum: 0 }
        req_per_ip_max: { type: number, minimum: 0 }
    Snapshot:
      type: object
      required: [ts, window_s, rps, p50, p95, p99, error_rate, unique_ips, top_ip_rps, avg_payload_bytes, endpoints]
      properties:
        ts: { type: string, format: date-time }
        window_s: { type: integer }
        rps: { type: number }
        p50: { type: number }
        p95: { type: number }
        p99: { type: number }
        error_rate: { type: number }
        unique_ips: { type: integer }
        top_ip_rps: { type: number }
        avg_payload_bytes: { type: number }
        endpoints:
          type: object
          additionalProperties: { type: integer }
    LogRecord:
      type: object
      required: [ts, endpoint, method, status, ip]
      properties:
        ts: { type: string, format: date-time }
        endpoint: { type: string, minLength: 1 }
        method: { type: string, minLength: 1 }
        status: { type: integer, minimum: 100, maximum: 599 }
        latency_ms: { type: number, minimum: 0 }
        ip: { type: string }
        payload_bytes: { type: integer, minimum: 0 }
    IngestRequest:
      type: object
      required: [logs]
      properties:
        logs:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: '#/components/schemas/LogRecord' }
    IngestResponse:
      type: object
      required: [accepted]
      properties:
        accepted: { type: integer }
    EndpointEvidence:
      type: object
      required: [endpoint_count, endpoints_with_errors, most_errors_on_one_endpoint, most_errors_endpoint_samples, slowest_endpoint_p95_ms, slowest_endpoint_samples]
      properties:
        endpoint_count: { type: integer }
        endpoints_with_errors: { type: integer }
        most_errors_on_one_endpoint: { type: integer }
        most_errors_endpoint_samples: { type: integer }
        slowest_endpoint_p95_ms: { type: number }
        slowest_endpoint_samples: { type: integer }
    BaselineEvidence:
      type: object
      required: [samples, start, end, rps, p95, error_rate]
      properties:
        samples: { type: integer }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        rps: { type: number }
        p95: { type: number }
        error_rate: { type: number }
    IncidentEvidence:
      type: object
      required: [trigger_type, severity, value, threshold, window_seconds, rps, p50, p95, p99, error_rate, top_ip_rps, unique_ips]
      properties:
        trigger_type: { type: string }
        severity: { type: string }
        value: { type: number }
        threshold: { type: number }
        observed_at: { type: string, format: date-time }
        window_seconds: { type: integer }
        request_count: { type: integer }
        rps: { type: number }
        p50: { type: number }
        p95: { type: number }
        p99: { type: number }
        error_rate: { type: number }
        top_ip_rps: { type: number }
        unique_ips: { type: integer }
        endpoint_summary: { $ref: '#/components/schemas/EndpointEvidence' }
        baseline: { $ref: '#/components/schemas/BaselineEvidence' }
    Diagnosis:
      type: object
      required: [pattern, direction, urgency, pattern_confidence, direction_confidence, urgency_confidence, evidence_probability, model, input_tokens, evidence_sufficient]
      properties:
        pattern: { type: string }
        direction: { type: string }
        urgency: { type: number }
        pattern_confidence: { type: number }
        direction_confidence: { type: number }
        urgency_confidence: { type: number }
        evidence_probability: { type: number }
        model: { type: string }
        input_tokens: { type: integer }
        evidence_sufficient: { type: boolean }
        evidence: { $ref: '#/components/schemas/IncidentEvidence' }
    Anomaly:
      type: object
      required: [type, severity, message, value, threshold, detected_at]
      properties:
        id: { type: integer, description: 'SQLite integer represented as a JSON number.' }
        type: { type: string }
        severity: { type: string }
        message: { type: string }
        value: { type: number }
        threshold: { type: number }
        analysis: { type: string }
        analysis_status: { type: string }
        diagnosis: { $ref: '#/components/schemas/Diagnosis' }
        detected_at: { type: string, format: date-time }
    AuditEvent:
      type: object
      required: [id, ts, actor_email, action, target_project_id, outcome, request_id, details]
      properties:
        id: { type: integer, description: 'SQLite integer represented as a JSON number.' }
        ts: { type: string, format: date-time }
        actor_email: { type: string }
        action: { type: string }
        target_project_id: { type: string }
        outcome: { type: string }
        request_id: { type: string }
        details:
          type: object
          additionalProperties: { type: string }
    MetricSnapshotEvent:
      type: object
      required: [event_type, project_id, timestamp, data]
      properties:
        event_type: { type: string, enum: [metric_snapshot] }
        project_id: { type: string }
        timestamp: { type: string, format: date-time }
        data: { $ref: '#/components/schemas/Snapshot' }
    AnomalyAlertEvent:
      type: object
      required: [event_type, project_id, timestamp, data]
      properties:
        event_type: { type: string, enum: [anomaly_alert] }
        project_id: { type: string }
        timestamp: { type: string, format: date-time }
        data: { $ref: '#/components/schemas/Anomaly' }
    LiveEvent:
      oneOf:
        - { $ref: '#/components/schemas/MetricSnapshotEvent' }
        - { $ref: '#/components/schemas/AnomalyAlertEvent' }
      discriminator:
        propertyName: event_type
        mapping:
          metric_snapshot: '#/components/schemas/MetricSnapshotEvent'
          anomaly_alert: '#/components/schemas/AnomalyAlertEvent'
