# oauth2-proxy static configuration.
#
# Secrets and deployment-specific values come from OAUTH2_PROXY_* environment
# variables in compose.yaml, not from this file.

provider = "google"

# Caddy terminates TLS and reverse-proxies to this process.
reverse_proxy = true

# Send X-Auth-Request-Email / X-Auth-Request-User to Caddy forward_auth and
# then to the Go API.
set_xauthrequest = true

# Session cookies. oauth2-proxy sets HttpOnly and Path=/ by default; both are
# pinned here so a config regression cannot expose the session to JavaScript
# or other paths on the host.
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"

# Session lifetime and refresh: the cookie lives 7 days, and the session is
# revalidated with the provider every hour. A user revoked at the provider
# (account disabled, removed from the allowed domain) is locked out at the
# next refresh or sign-in. Independent of that, the Go API evaluates
# ADMIN_EMAILS on every request, so removing an email from the allowlist
# revokes its API admin rights immediately — even with a live session.
cookie_expire = "168h"
cookie_refresh = "1h"

skip_provider_button = true

# Set OAUTH2_PROXY_EMAIL_DOMAINS, OAUTH2_PROXY_REDIRECT_URL, and
# OAUTH2_PROXY_WHITELIST_DOMAINS in .env.
#
# For a generic OIDC provider, replace the provider line above with:
#   provider = "oidc"
#   oidc_issuer_url = "https://idp.example.com"
